<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Favicon: the Brenkai mark, simplified for 16px.
       The logo itself cannot be used here. Rendered at 16px, the size a
       browser tab actually uses, the faceted polyhedron collapses into a
       speck and the code brackets at its centre vanish entirely (D40, P17).
       Shrinking a logo is not the same as designing a favicon.

       What survives instead is the mark's STRUCTURE: three masses arranged
       in a triangle around an empty centre. That silhouette is what the eye
       recognises at this size, and it holds down to 16px.

       Gradient runs blue to purple, matching the action and accent tokens.
       Note: no double hyphen anywhere in this comment. XML forbids it, and
       writing the token names literally here broke the whole file once. -->
  <defs>
    <!-- userSpaceOnUse so the gradient crosses the whole mark. With the
         default objectBoundingBox each triangle got its own full sweep and
         all three came out the same purple. The logo runs blue on the left
         to purple on the right, and now this does too. -->
    <linearGradient id="b" gradientUnits="userSpaceOnUse" x1="4" y1="8" x2="28" y2="25">
      <stop offset="0" stop-color="#478AF5"/>
      <stop offset="1" stop-color="#D068F3"/>
    </linearGradient>
  </defs>

  <!-- Dark tile so the mark holds up on a light browser tab too -->
  <rect width="32" height="32" rx="7" fill="#0B0B0F"/>

  <g fill="url(#b)">
    <path d="M16 5.5 L21.8 15.6 L10.2 15.6 Z"/>
    <path d="M9.6 16.7 L15.4 26.8 L3.8 26.8 Z"/>
    <path d="M22.4 16.7 L28.2 26.8 L16.6 26.8 Z"/>
  </g>
</svg>
