<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Brenkai Studio</title>
<meta name="description" content="That page doesn't exist.">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">

<script>
  (function () {
    document.documentElement.classList.remove('no-js');
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>

<!-- Absolute paths: a 404 can be served from any URL depth -->
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/pages.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="header" data-header>
  <div class="container header__inner">
    <a class="wordmark" href="/index.html" aria-label="Brenkai Studio, home">
      <img class="wordmark__mark" src="/assets/img/logo.png" width="192" height="192" alt="" fetchpriority="high">
      <span class="wordmark__text">
        <span class="wordmark__name">Bren<span>kai</span></span>
        <span class="wordmark__sub">studio</span>
      </span>
    </a>

    <div class="header__actions">
      <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch to light theme">
        <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main">
  <section class="notfound container">
    <p class="kicker" style="justify-content: center">Error 404</p>
    <h1 class="display-lg">Nothing<br><span class="grad">here</span>.</h1>
    <p class="lede" style="margin-inline: auto">That page doesn't exist — or it moved. Nothing you did wrong.</p>
    <p>
      <a class="btn btn--primary" href="/index.html">
        <span>Back to home</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </p>
  </section>
</main>

<footer class="footer">
  <div class="container">
    <div class="footer__bottom" style="border-top: none; padding-top: 0">
      <span>© 2026 Brenkai Studio</span>
      <span>Built by hand</span>
    </div>
  </div>
</footer>

<script type="module" src="/js/theme.js"></script>
<script type="module" src="/js/nav.js"></script>
</body>
</html>
